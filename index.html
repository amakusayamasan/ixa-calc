<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IXA 部隊計算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261114t">
</head>
<body>
<div class="wrap">
  <header>
    <h1>IXA 部隊計算</h1>
    <div class="auth">
      <span id="role" class="role">閲覧のみ</span>
      <span id="userName" class="note"></span>
      <button id="login" class="btn small ghost" type="button" hidden>管理者ログイン</button>
      <button id="logout" class="btn small ghost" type="button" hidden>ログアウト</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button id="tab-calc" role="tab" aria-selected="true" data-view="calc">部隊計算</button>
    <button id="tab-master" role="tab" aria-selected="false" data-view="master">マスタ管理</button>
  </nav>
  <div id="status" class="banner" hidden></div>
  <div id="uidnote" class="banner uidnote" hidden></div>

  <section id="view-calc" class="view">
    <div class="opts">
      <div class="field"><span class="label">部隊タイプ</span>
        <div class="seg modeseg">
          <button type="button" data-mode="atk" aria-pressed="true">攻撃部隊</button>
          <button type="button" data-mode="def" aria-pressed="false">防御部隊</button>
        </div></div>
      <div class="field" style="width:130px"><label class="label" for="jin">バフ・デバフ</label>
        <input id="jin" type="number" step="0.01" value="1.05"></div>
      <div id="enemyBox" class="enemybox" hidden>
        <div class="field" style="width:110px"><label class="label" for="enemyCount">敵の武将数</label>
          <input id="enemyCount" type="number" step="1" min="1" value="140"></div>
        <div class="field" style="width:190px"><label class="label" for="enemyFire">敵の推定火力</label>
          <input id="enemyFire" type="number" step="1" min="0" value="150000000000"></div>
      </div>
      <div class="field"><span class="label">傑バフ</span>
        <button id="jbBtn" class="btn ghost jbbtn" type="button" aria-expanded="false" aria-controls="jbpanel">傑バフ:なし</button></div>
    </div>
    <div id="jbpanel" class="jbpanel" hidden></div>
    <div class="opts teambar">
      <div class="field teamname"><label class="label" for="teamName">部隊名</label>
        <input id="teamName" type="text" maxlength="40" placeholder="例:剣心今川" autocomplete="off"></div>
      <button id="teamSave" class="btn" type="button">この編成を保存</button>
      <button id="teamBtn" class="btn ghost" type="button" aria-expanded="false" aria-controls="teampanel">保存した部隊</button>
      <span id="teamMsg" class="note teammsg" aria-live="polite"></span>
    </div>
    <div id="teampanel" class="jbpanel" hidden></div>

    <div class="result" aria-live="polite">
      <div class="big"><span class="label">最大火力</span><div class="v num" id="r-total">—</div><div class="sub num" id="r-total-jp"></div></div>
      <div class="stats">
        <div><span class="label" id="lbl-base">素攻合計</span><b class="num" id="r-base">—</b></div>
        <div><span class="label">スキル総合計</span><b class="num" id="r-skill">—</b></div>
        <div><span class="label" id="lbl-buff">総攻バフ(全枠+火焔)</span><b class="num" id="r-buff">—</b></div>
        <div><span class="label">黎天列光 / 火焔武闘</span><b class="num" id="r-special">—</b></div>
        <div id="r-enemy-box" hidden><span class="label">敵火力加算</span><b class="num" id="r-enemy">—</b></div>
      </div>
    </div>

    <div class="slots" id="slots"></div>
  </section>

  <section id="view-master" class="view" hidden>
    <div class="mhead">
      <div class="seg" id="mtabs">
        <button type="button" aria-pressed="true" data-m="cards">武将マスタ</button>
        <button type="button" aria-pressed="false" data-m="skills">スキルマスタ</button>
        <button type="button" aria-pressed="false" data-m="soldiers">兵種</button>
        <button type="button" aria-pressed="false" data-m="jbuffs">傑バフ</button>
      </div>
      <div class="mtools">
        <input id="msearch" class="search" type="search" placeholder="名前で絞り込み">
        <button id="mimport" class="btn ghost" type="button" hidden>Excelから取り込み</button>
        <button id="madd" class="btn" type="button" hidden>新規追加</button>
        <button id="maddSkill" class="btn" type="button" hidden>スキル追加</button>
        <button id="maddInit" class="btn" type="button" hidden>初期スキル追加</button>
      </div>
    </div>
    <div id="people" class="people" hidden></div>
    <p class="note" id="mnote"></p>
    <div id="seedbox"></div>
    <div id="importbox"></div>
    <div id="editor"></div>
    <div class="tablewrap"><table id="mtable"></table></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/core.js?v=20261114t"></script>
<script src="js/fields.js?v=20261114t"></script>
<script src="js/skills.js?v=20261114t"></script>
<script src="js/cards.js?v=20261114t"></script>
<script src="js/unit.js?v=20261114t"></script>
<script src="js/calc.js?v=20261114t"></script>
<script src="js/calc-view.js?v=20261114t"></script>
<script src="js/teams.js?v=20261114t"></script>
<script src="js/master.js?v=20261114t"></script>
<script src="js/excel.js?v=20261114t"></script>
<script src="js/admin.js?v=20261114t"></script>
<script src="js/main.js?v=20261114t"></script>
</body>
</html>
